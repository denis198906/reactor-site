<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reactor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-style">
:root{
  --step-word:"Шаг "; --signal-base:#E4572E; --steel-base:#1F4E79;
  --ground:#F1F2EF; --surface:#FFFFFF; --surface-2:#E7E9E4;
  --ink:#14202B; --ink-2:#4B5762; --line:#C9CEC8; --line-soft:#DEE1DB;
  --steel:var(--steel-base); --steel-soft:color-mix(in srgb,var(--steel-base) 13%,#fff);
  --signal:var(--signal-base); --signal-ink:#FFFFFF;
  --ok:#2E7D4F; --warn:#B7791F; --shadow:0 18px 50px rgba(20,32,43,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F171F; --surface:#182430; --surface-2:#1F2D3A;
    --ink:#E8ECEF; --ink-2:#A3AEB9; --line:#33434F; --line-soft:#26333E;
    --steel:color-mix(in srgb,var(--steel-base) 45%,#fff); --steel-soft:color-mix(in srgb,var(--steel-base) 35%,#182430);
    --signal:color-mix(in srgb,var(--signal-base) 85%,#fff); --signal-ink:#14202B;
    --ok:#6FCB8F; --warn:#E0B24C; --shadow:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#0F171F; --surface:#182430; --surface-2:#1F2D3A;
  --ink:#E8ECEF; --ink-2:#A3AEB9; --line:#33434F; --line-soft:#26333E;
  --steel:color-mix(in srgb,var(--steel-base) 45%,#fff); --steel-soft:color-mix(in srgb,var(--steel-base) 35%,#182430);
  --signal:color-mix(in srgb,var(--signal-base) 85%,#fff); --signal-ink:#14202B;
  --ok:#6FCB8F; --warn:#E0B24C; --shadow:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Unbounded","Arial Black",Arial,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
h1{font-weight:700;font-size:clamp(34px,5.2vw,64px);letter-spacing:-.01em}
h2{font-weight:500;font-size:clamp(26px,3.2vw,40px)}
h3{font-weight:500;font-size:18px;line-height:1.3}
p{margin:0}
a{color:var(--steel)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
@media (max-width:720px){.wrap{padding:0 18px}}
section{padding:88px 0;border-top:1px solid var(--line-soft);scroll-margin-top:72px}
@media (max-width:720px){section{padding:60px 0}}
.lead{color:var(--ink-2);max-width:60ch;font-size:19px;margin-top:14px}
.sec-head{max-width:760px;margin-bottom:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:16px;padding:14px 22px;border-radius:6px;text-decoration:none;cursor:pointer;border:1.5px solid transparent;white-space:nowrap}
.btn-primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn-primary:hover{filter:brightness(.94)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:9px 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.nav .wrap{display:flex;align-items:center;gap:26px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:"Unbounded",sans-serif;font-weight:700;font-size:16px}
.brand i{width:22px;height:22px;border:3px solid var(--signal);border-radius:3px;display:block;position:relative}
.brand i::after{content:"";position:absolute;inset:4px;background:var(--ink);opacity:.9}
.nav ul{list-style:none;margin:0 0 0 auto;padding:0;display:flex;gap:22px}
.nav ul a{color:var(--ink-2);text-decoration:none;font-size:15px}
.nav ul a:hover{color:var(--ink)}
.lsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lsw button{background:none;border:0;padding:5px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.lsw button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
@media (max-width:900px){.nav ul{display:none}.lsw{margin-left:auto}}
.hero{border-top:0;padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
@media (max-width:980px){.hero .wrap{grid-template-columns:1fr}}
.hero .kicker{display:inline-block;font-size:14px;color:var(--steel);border:1px solid var(--steel);padding:5px 10px;border-radius:999px;margin-bottom:22px}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .note{color:var(--ink-2);font-size:14px;margin-top:14px}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.shot img{width:100%;height:auto}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;font-size:13px;position:relative}
.screen .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.screen .bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.screen .bar .url{margin-left:8px;flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:3px 10px;color:var(--ink-2);font-family:"JetBrains Mono",monospace;font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.screen .body{display:grid;grid-template-columns:150px 1fr}
@media (max-width:520px){.screen .body{grid-template-columns:1fr}.screen aside{display:none}}
.screen aside{border-right:1px solid var(--line-soft);padding:12px 0}
.screen aside div{padding:7px 14px;color:var(--ink-2)}
.screen aside div.on{color:var(--ink);font-weight:600;background:var(--steel-soft);border-left:3px solid var(--steel);padding-left:11px}
.screen main{padding:14px 16px 18px;min-width:0}
.screen .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.screen .ttl b{font-family:"Unbounded",sans-serif;font-weight:500;font-size:13px}
.screen .ttl span{color:var(--ink-2);font-size:12px;white-space:nowrap}
.screen table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.screen th{text-align:left;font-weight:500;color:var(--ink-2);font-size:11px;padding:6px;border-bottom:1px solid var(--line)}
.screen td{padding:7px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.screen td.num{font-family:"JetBrains Mono",monospace;font-size:12px;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.steel{background:var(--steel-soft);color:var(--steel)}
.stamp{position:absolute;right:22px;bottom:18px;transform:rotate(-7deg);border:3px double var(--signal);color:var(--signal);padding:7px 12px 6px;font-family:"Unbounded",sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;background:color-mix(in srgb,var(--surface) 85%,transparent);animation:press .5s cubic-bezier(.2,.9,.3,1.2) .4s both}
.stamp small{display:block;font-family:"JetBrains Mono",monospace;font-weight:400;font-size:9.5px;letter-spacing:.04em;text-transform:none}
@keyframes press{from{opacity:0;transform:rotate(-7deg) scale(1.5)}to{opacity:1;transform:rotate(-7deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
.strip{border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:var(--surface);padding:18px 0}
.strip .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;color:var(--ink-2);font-size:14px}
.strip .wrap>span{color:var(--ink);font-weight:600}
.strip b{font-weight:500;color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:13px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.role{padding:28px 26px;border-right:1px solid var(--line)}
.role:last-child{border-right:0}
@media (max-width:900px){.roles{grid-template-columns:1fr}.role{border-right:0;border-bottom:1px solid var(--line)}.role:last-child{border-bottom:0}}
.role h3{font-size:20px;margin-bottom:14px}
.role .pain{color:var(--ink-2);padding-left:14px;border-left:2px solid var(--line);margin-bottom:16px;font-size:15.5px}
.role ul{margin:0;padding-left:18px;font-size:15.5px}
.role li{margin:6px 0}
.role li::marker{color:var(--signal)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;counter-reset:step}
@media (max-width:1000px){.flow{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.flow{grid-template-columns:1fr}}
.step{padding-top:18px;border-top:3px solid var(--steel);counter-increment:step}
.step::before{content:counter(step);font-family:"Unbounded",sans-serif;font-weight:700;font-size:28px;color:var(--steel);display:block;margin-bottom:6px;line-height:1}
.step h3{font-size:17px;margin-bottom:8px}
.step p{color:var(--ink-2);font-size:15px}
.step .out{margin-top:12px;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-soft);padding:8px 10px;border-radius:6px}
.step .out b{font-weight:600;display:block;color:var(--ink-2);font-size:11.5px;margin-bottom:2px}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.mods{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.mods{grid-template-columns:1fr}}
.mod{background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.mod .mimg{margin:-22px -22px 10px;aspect-ratio:16/9;border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.mod .mimg img{width:100%;height:100%;object-fit:cover;object-position:top left}
.mod h3{font-size:17px}
.mod p{color:var(--ink-2);font-size:15px}
.mod .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.mod .tags span{font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:2px 8px;border-radius:4px}
.band{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media (max-width:900px){.band{grid-template-columns:1fr}}
.band h2{font-size:clamp(24px,2.6vw,32px)}
.band ul{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:12px}
.band li{padding-left:22px;position:relative;font-size:16px}
.band li::before{content:"";position:absolute;left:0;top:9px;width:10px;height:10px;background:var(--steel);border-radius:2px}
.band .signal li::before{background:var(--signal);border-radius:50%}
.comp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1000px){.comp{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.comp{grid-template-columns:1fr}}
.comp div{background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--steel);padding:16px 18px;border-radius:6px}
.comp b{display:block;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:14px;margin-bottom:6px}
.comp p{color:var(--ink-2);font-size:14.5px}
.deploy{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--steel-soft);border-radius:10px;padding:26px 28px}
@media (max-width:720px){.deploy{grid-template-columns:1fr}}
.deploy h3{font-size:18px;margin-bottom:8px}
.deploy p{color:var(--ink-2);font-size:15px}
.roll{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:r}
@media (max-width:900px){.roll{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.roll{grid-template-columns:1fr}}
.roll div{counter-increment:r;background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:20px}
.roll div::before{content:var(--step-word) counter(r);font-size:12.5px;font-weight:600;color:var(--signal);display:block;margin-bottom:8px}
.roll h3{font-size:17px;margin-bottom:8px}
.roll p{color:var(--ink-2);font-size:15px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 24px;display:flex;flex-direction:column}
.plan.hot{border-color:var(--signal);box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 20%,transparent)}
.plan h3{font-size:20px}
.plan .for{color:var(--ink-2);font-size:14.5px;margin-top:4px;min-height:44px}
.plan .price{font-family:"Unbounded",sans-serif;font-weight:500;font-size:20px;margin:18px 0 4px}
.plan .price small{display:block;font-family:"Golos Text",sans-serif;font-weight:400;font-size:13px;color:var(--ink-2)}
.plan ul{margin:16px 0 22px;padding-left:18px;font-size:15px;display:grid;gap:6px}
.plan li::marker{color:var(--steel)}
.plan .btn{margin-top:auto}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
@media (max-width:760px){.gal{grid-template-columns:1fr}}
.gal figure{margin:0}
.gal figcaption{font-size:14.5px;color:var(--ink-2);margin-top:10px}
.gal .empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:34px;color:var(--ink-2);text-align:center;font-size:15px}
.cgroup{margin-top:34px}
.cgroup:first-of-type{margin-top:0}
.cgroup>h3{font-size:15px;color:var(--steel);letter-spacing:.02em;padding-bottom:10px;border-bottom:2px solid var(--steel);margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.cgroup>h3 small{font-family:"JetBrains Mono",monospace;font-weight:400;font-size:12px;color:var(--ink-2)}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);column-gap:36px}
@media (max-width:800px){.cgrid{grid-template-columns:1fr}}
.cf{border-bottom:1px solid var(--line-soft)}
.cf summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:14px 0}
.cf summary::-webkit-details-marker{display:none}
.cf summary b{font-weight:600;font-size:16px}
.cf summary span{grid-column:1;color:var(--ink-2);font-size:14.5px}
.cf summary::after{content:"+";grid-column:2;grid-row:1/3;align-self:center;font-family:"Unbounded",sans-serif;color:var(--signal);font-size:15px}
.cf[open] summary::after{content:"–"}
.cf ul{margin:0 0 16px;padding-left:18px;font-size:14.5px;display:grid;gap:5px}
.cf li::marker{color:var(--steel)}
.cf .stub{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.faq{max-width:820px}
.faq details{border-top:1px solid var(--line-soft);padding:6px 0}
.faq details:last-child{border-bottom:1px solid var(--line-soft)}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:"Unbounded",sans-serif;color:var(--signal);flex:none}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--ink-2);padding:0 0 16px;max-width:65ch}
.demo{background:var(--ink);color:var(--ground)}
.demo h2,.demo p{color:inherit}
.demo .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media (max-width:900px){.demo .wrap{grid-template-columns:1fr}}
.demo .lead{color:color-mix(in srgb,var(--ground) 72%,transparent)}
.demo ul{margin:22px 0 0;padding-left:18px;color:color-mix(in srgb,var(--ground) 82%,transparent);display:grid;gap:8px}
.demo li::marker{color:var(--signal)}
.dform{background:var(--surface);color:var(--ink);border-radius:10px;padding:26px;display:grid;gap:14px}
.dform label{display:grid;gap:6px;font-size:14px;font-weight:600}
.dform input,.dform select,.dform textarea{font:inherit;font-size:15px;font-weight:400;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink);width:100%}
.dform textarea{min-height:84px;resize:vertical}
.dform .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.dform .row{grid-template-columns:1fr}}
.dform .fine{font-size:12.5px;color:var(--ink-2);font-weight:400}
.dform .sent{display:none;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);padding:12px 14px;border-radius:6px;font-weight:600}
.dform.done .sent{display:block}
footer{padding:34px 0;color:var(--ink-2);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between}
footer a{color:var(--ink-2)}
footer .adm{background:none;border:0;color:var(--ink-2);font:inherit;cursor:pointer;text-decoration:underline;padding:0}

/* ---------- admin drawer ---------- */
#admin{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;font-size:14px}
#admin .ah{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
#admin .ah b{font-family:"Unbounded",sans-serif;font-weight:500;font-size:14px;flex:1}
#admin .tabs{display:flex;border-bottom:1px solid var(--line-soft)}
#admin .tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px;font:inherit;font-weight:600;color:var(--ink-2);cursor:pointer}
#admin .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
#admin .abody{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
#admin .af{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line-soft);padding:12px 18px;display:grid;gap:8px}
#admin .af .st{font-size:12.5px;color:var(--ink-2);min-height:18px}
#admin .af .st.err{color:var(--signal)}
#admin .af .st.ok{color:var(--ok)}
#admin .af .bt{display:flex;gap:8px;flex-wrap:wrap}
#admin .ic{background:none;border:1px solid var(--line);border-radius:5px;padding:3px 8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.3}
#admin .ic:hover{background:var(--surface-2)}
#admin .ic.x{color:var(--signal)}
#admin .card{border:1px solid var(--line-soft);border-radius:8px;background:var(--ground)}
#admin .card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600}
#admin .card>summary::-webkit-details-marker{display:none}
#admin .card>summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#admin .card>summary .off{color:var(--ink-2);font-weight:400;font-size:12px}
#admin .cb{padding:4px 12px 12px;display:grid;gap:10px;border-top:1px solid var(--line-soft)}
#admin .fld{display:grid;gap:4px}
#admin .fld span{font-size:12px;color:var(--ink-2);font-weight:600}
#admin .fld input[type=text],#admin .fld input[type=email],#admin .fld select,#admin .fld textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);width:100%}
#admin .fld textarea{min-height:64px;resize:vertical;line-height:1.4}
#admin .fld.chk{grid-template-columns:auto 1fr;align-items:center;gap:8px}
#admin .item{border:1px solid var(--line-soft);border-radius:6px;background:var(--surface);padding:8px 10px 10px;display:grid;gap:8px}
#admin .item .ih{display:flex;align-items:center;gap:6px}
#admin .item .ih .t{flex:1;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#admin .items{display:grid;gap:8px}
#admin .hint{font-size:12.5px;color:var(--ink-2);line-height:1.45}
#admin .drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--ink-2);cursor:pointer}

 {id:'band',type:'band',on:true,nav:'',title:'',lead:'',items:[
  {title:'BIM‑модель, связанная со стройкой',lead:'Модель не лежит отдельным файлом у проектировщика. Она открывается в браузере и связана с журналами, сметой и графиком.',style:'steel',points:'**Тяжёлые IFC в браузере.** Выделение, изоляция, свойства, измерения, сечения и 2D‑планы из модели без установки ПО.\n**Захватки на модели.** Монтажные захватки рисуются в 3D и связываются с графиком третьего уровня.\n**Скан против модели.** Скан площадки совмещается с моделью, отклонения подсвечиваются тепловой картой, прогресс уходит в планировщик.\n**Замечания на элементе.** Технадзор ставит замечание прямо на элемент модели, а не «где‑то на седьмом этаже».'},

 {id:'faq',type:'faq',on:true,nav:'Вопросы',title:'Частые вопросы',lead:'',items:[
  {q:'Госстройнадзор действительно принимает документацию из системы?',a:'Журналы и акты выгружаются в XML по схемам Минстроя, а подписи ставятся УКЭП через КриптоПро. Это тот формат, который ГОСТ Р 70108‑2025 определяет как основной для электронной исполнительной документации.'},
  {q:'Работает ли система без интернета на площадке?',a:'Да. В мобильном приложении есть режим «Поле»: замечания с фото и факты работ записываются в очередь на устройстве и уходят на сервер, когда связь появляется. Офлайн‑копию объекта можно скачать заранее.'},
  {q:'На каких языках интерфейс?',a:'Русский, английский и китайский. Язык переключается в настройках и запоминается.'},
  {q:'Как защищены учётные записи?',a:'Двухфакторная аутентификация с резервными кодами, вход через корпоративный SSO и OAuth, список активных сессий с выходом на всех устройствах, журнал безопасности.'},
  {q:'У нас уже есть сметы в Гранд‑Смете и графики в MS Project. Придётся переделывать?',a:'Нет. Сметы импортируются из Гранд‑Сметы, ARPS, GSFX и ГГЭ, графики читаются из файлов MS Project вместе с ресурсами и связями.'},
  {q:'Можно ли установить платформу на наших серверах?',a:'Да. Платформа разворачивается в вашем Kubernetes единым набором конфигураций, подключается к вашему SSO и хранилищу файлов.'},
  {q:'Подрядчики и технадзор увидят наши финансовые данные?',a:'Нет. Доступ разграничивается по ролям и организациям, поэтому подрядчик видит свои журналы и задачи, а сметы и бюджет остаются у заказчика.'},
  {q:'Что с BIM, если модель весит несколько гигабайт?',a:'Модель конвертируется в лёгкий формат для браузера. Небольшие файлы обрабатываются на клиенте, тяжёлые конвертирует сервер.'}]},

 {id:'roles',type:'roles',on:true,nav:'Who it is for',title:'Owner, architect and GC on one set of records',lead:'Each party sees its own work and its own responsibility. The record is shared, so nobody argues about which revision was issued for construction.',items:[
  {title:'Owner',pain:'Monthly reports arrive as spreadsheets and are already stale. Change orders pile up, and the reasons behind cost overruns surface only at the next pay application.',points:'Live progress on site: S-curve, work fronts, dated site panoramas\nSchedule of values, pay applications and change orders reconcile with the budget automatically\nPunch list and inspection findings are visible without a site visit'},
  {title:'General contractor',pain:'Daily logs live on paper, submittals are tracked in a spreadsheet, and closeout means weeks of chasing as-builts, O&M manuals and lien waivers.',points:'Daily logs, punch lists and inspection reports are filled in from the site, on a phone\nSubmittal and RFI routing with GC review, architect review and stamped responses\nPay applications G702/G703 and closeout packages generated from the records'},
  {title:'Architect and inspectors',pain:'RFIs come by email and get lost, submittal reviews have no audit trail, and special inspection reports sit in someone\'s inbox.',points:'RFIs and submittals with due dates, review stamps and a full history\nA punch item is pinned to a point on the drawing or an element of the BIM model\nSpecial inspection reports filed by discipline and tied to the schedule'}]},
 {id:'flow',type:'flow',on:true,nav:'How it works',title:'From schematic design to occupancy without leaving the system',lead:'The modules follow the same order as a Design-Bid-Build project. Each stage produces the record the next one needs.',items:[
  {title:'Design',text:'SD, DD and CD phases in the common data environment: revisions, purpose of issue from IFI to IFC, BIM model checks and quantity takeoff from the model.',out:'Construction documents issued for construction'},
  {title:'Bid and award',text:'Bill of quantities by CSI MasterFormat division, invitations to subcontractors, bid forms, bid levelling and award. The winning bid converts into a contract.',out:'Awarded contract and schedule of values'},
  {title:'Construction',text:'Daily logs, submittals and RFIs, special inspections, punch lists, CPM schedule with long-lead items. Progress is checked against the BIM model and site scans.',out:'Daily logs, inspection reports, RFIs, change events'},
  {title:'Billing and changes',text:'Pay applications on G702/G703 built from the schedule of values, retainage tracking, change orders on G701, progress and final lien waivers.',out:'Pay applications, change orders, lien waivers'},
  {title:'Closeout and operation',text:'As-builts, substantial completion on G704, permits and certificate of occupancy, then assets linked to BIM elements, preventive maintenance and warranties.',out:'Closeout package, asset register'}]},
 {id:'modules',type:'modules',on:true,nav:'Modules',title:'Twelve core modules instead of twelve applications',lead:'Enable only what you need. Every module works with the same projects, people and documents. The full platform inventory is below.',items:[
  {title:'Projects and sites',text:'A project catalogue with filters and cards, a project hub with the building, level, room hierarchy. Role dashboards for the project engineer, owner representative and GC superintendent. Risk register with a matrix and bow-tie analysis.',tags:'Project hub\nRisks\nRole dashboards',img:''},
  {title:'Documents',text:'Common data environment per ISO 19650: folders with permissions, drawing register, revisions with purpose of issue, PDF comparison with highlighted differences, transmittals, package completeness check, register export to Excel.',tags:'Drawing register\nTransmittals\nRevision diff',img:''},
  {title:'Submittals, RFIs and approvals',text:'A visual route designer for submittal review: GC review, then architect and engineer review with Approved, Approved as noted, Revise and resubmit stamps. RFIs with due dates. A red pencil for markups over the drawing. Deputies during leave.',tags:'Submittals\nRFIs\nReview stamps',img:''},
  {title:'Daily logs and inspections',text:'Daily logs with crew counts, equipment, deliveries, delays and weather. Special inspection reports by discipline, incoming material inspection with mill certs and test results, concealed-work inspection acts, progress billing acts.',tags:'Daily log\nSpecial inspections\nMaterial inspection',img:''},
  {title:'Punch lists and field observations',text:'Observations pinned to the drawing, notices to subcontractors from form templates, subcontractor responses, calling an inspector for concealed work, quality checklists, OSHA 29 CFR 1926 violation notices, voice capture of deviations.',tags:'Punch list\nOSHA notices\nChecklists',img:''},
  {title:'Estimates, budget and pay applications',text:'Estimates by MasterFormat division with quantity takeoff from BIM, budget plan and actual by cost code, schedule of values, pay applications G702/G703, retainage, change orders G701, lien waivers, cost to complete, Earned Value.',tags:'SOV\nG702/G703\nRetainage',img:''},
  {title:'Bids and contracts',text:'A bid package from publication to award: invitations, bid forms, bid levelling with unit normalisation, AI bid analysis, conversion into a contract. Contracts with change orders, subcontracts, revisions and reminders.',tags:'Bid levelling\nAI analysis\nChange orders',img:''},
  {title:'BIM model',text:'IFC models in the browser: selection, properties, sections, element editing, work zones, MEP clash checks and comparison of the model with a site scan. On mobile the model opens as a 3D scene.',tags:'IFC\nClash checks\nScan-to-BIM',img:''},
  {title:'Planning and time',text:'CPM schedules with MS Project import, critical path and long-lead items, kanban task boards, a calendar with assignee load, timesheets with crew hour posting and productivity reports, work fronts.',tags:'CPM\nKanban\nTimesheets',img:''},
  {title:'Site and field',text:'A daily site log with people, equipment and weather, photo capture, punch list. Offline superintendent mode: observations and work quantities without a connection, sync when the network returns. Digital site plan.',tags:'Offline\nPunch list\nSite plan',img:''},
  {title:'Collaboration',text:'Chats with reactions and pinned messages, video calls with live captions, meetings with agenda, action items and minutes, notifications with quiet hours, global search.',tags:'Chats\nCalls\nMinutes',img:''},
  {title:'Procurement, permits and operation',text:'Warehouse with stock, movements and stocktaking, a delivery log with supplier rating and long-lead item tracking. Permits with the AHJ from application to certificate of occupancy. After closeout: assets linked to BIM elements, work requests, preventive maintenance, warranties.',tags:'Long-lead items\nPermits\nAssets',img:''}]},

 {id:'band',type:'band',on:true,nav:'',title:'',lead:'',items:[
  {title:'A BIM model tied to the site',lead:'The model does not sit as a separate file with the designer. It opens in the browser and is tied to logs, the estimate and the schedule.',style:'steel',points:'**Heavy IFC in the browser.** Selection, isolation, properties, measurements, sections and 2D plans from the model without installing software.\n**Work zones on the model.** Installation zones are drawn in 3D and linked to the level-three schedule.\n**Scan against model.** A site scan is aligned with the model, deviations are highlighted as a heat map, progress flows into the planner.\n**Remarks on the element.** The supervisor pins a remark to the model element, not somewhere on the seventh floor.'},
  {title:'An assistant that calculates rather than invents',lead:'Models run inside your perimeter. A person always checks the result, and calculations stay deterministic.',style:'signal',points:'**A data question in plain language.** "How much concrete was placed in August on building 2" becomes a database query and an answer with figures.\n**Normative control of design documentation.** A check against GOST R 21.101 with a conclusion per section.\n**Classification on upload.** Document type and classifier code are detected automatically.\n**Meeting minutes.** Transcription, speaker separation and structured minutes with action items.\n**Work rate setting.** Labour hours from standards, a text mode only for non-standard cases.'}]},
 {id:'compliance',type:'compliance',on:true,nav:'Standards',title:'Built around US contract documents and codes',lead:'The platform core is shared, and the jurisdiction is a pluggable adapter: the estimating engine, document generator and signature provider are switched per project.',items:[
  {title:'AIA G702 / G703',text:'Pay applications and continuation sheets built from the schedule of values, with retainage and previously certified amounts.'},
  {title:'AIA G701 and G704',text:'Change orders with revised contract sum and time, and the certificate of substantial completion at closeout.'},
  {title:'CSI MasterFormat',text:'Bills of quantities, cost codes and bid forms by MasterFormat division instead of national unit rate books.'},
  {title:'Submittals and RFIs',text:'Shop drawings, product data and samples with two-stage review and standard stamps. RFIs with due dates and history.'},
  {title:'IBC Chapter 17',text:'Special inspection reports by discipline, filed in the CDE and tied to the schedule.'},
  {title:'OSHA 29 CFR 1926',text:'A dedicated violation notice type referencing code sections for fast citations on site.'},
  {title:'Lien waivers',text:'Progress and final lien waivers generated from form templates before retainage release.'},
  {title:'Units and formats',text:'Feet and inches in the field, meters in BIM, MM/DD/YYYY dates, USD, all US time zones.'}]},

 {id:'rollout',type:'rollout',on:true,nav:'',title:'Rollout that does not stop the job',lead:'We start with one project and the one process that hurts most, usually submittals or pay applications. We expand once the team is already working in the system.',items:[
  {title:'Demonstration',text:'We show the platform on your scenarios: a typical project, your daily log format, your submittal review chain.'},
  {title:'Pilot on a project',text:'One project, one or two modules. We load the drawing set, set up roles, cost codes and review routes.'},
  {title:'Migration and training',text:'Import of estimates, MS Project schedules and the document archive. Training superintendents to work from the site.'},
  {title:'Launch and support',text:'Connecting the remaining projects and modules, integrations with accounting and document systems, a dedicated manager.'}]},
 {id:'pricing',type:'pricing',on:true,nav:'Pricing',title:'Pricing',lead:'The cost depends on the number of projects, users and selected modules. We prepare an exact quote after the demonstration.',items:[
  {title:'Project',forw:'For a subcontractor or GC on one or several projects',price:'On request',sub:'cloud, per user',points:'Documents, submittals and RFIs\nDaily logs and punch lists\nPay applications G702/G703\nMobile app',hot:false,cta:'Discuss'},
  {title:'Company',forw:'For a general contractor or developer with a portfolio of projects',price:'On request',sub:'cloud or your environment',points:'All modules, including estimates, budget and bidding\nBIM model and CPM planning\nInspections with separation by company\nIntegrations: SSO, document systems, accounting',hot:true,cta:'Request a demo'},
  {title:'Enterprise',forw:'For public owners and groups of companies with hosting requirements',price:'On request',sub:'installed in your environment',points:'Installation in your Kubernetes\nSecurity review and compliance support\nCustom forms and reports for your procedures\nA dedicated rollout team',hot:false,cta:'Discuss'}]},
 {id:'faq',type:'faq',on:true,nav:'FAQ',title:'Frequently asked questions',lead:'',items:[
  {q:'Does it produce AIA pay applications?',a:'Yes. G702 and G703 are generated from the schedule of values with retainage and previously certified amounts, and G701 change orders and the G704 certificate of substantial completion come from the same records.'},
  {q:'How are submittals and RFIs handled?',a:'Submittals go through a configurable review route, typically GC review followed by architect and engineer review, with Approved, Approved as noted, Rejected and Revise and resubmit stamps. RFIs carry due dates, assignees and a full history.'},
  {q:'Does the system work without internet on site?',a:'Yes. The mobile app has a Field mode: observations with photos and work quantities are queued on the device and sent to the server when the connection returns. An offline copy of the project can be downloaded in advance.'},
  {q:'Which units and formats are used?',a:'Feet and inches in the field, meters inside the BIM model, MM/DD/YYYY dates, USD, and every US time zone. The interface is available in English, Russian and Chinese.'},
  {q:'We already have estimates and schedules in MS Project. Do we have to redo them?',a:'No. Schedules are read from MS Project files together with resources and links, and estimates import from common estimating formats or as spreadsheets by MasterFormat division.'},
  {q:'Can the platform be installed on our servers?',a:'Yes. The platform deploys into your Kubernetes as a single set of configurations and connects to your SSO and file storage.'},
  {q:'Will subcontractors and inspectors see our financial data?',a:'No. Access is separated by roles and companies, so a subcontractor sees its own logs, submittals and tasks while the schedule of values and budget stay with the GC and the owner.'},
  {q:'How are accounts protected?',a:'Two-factor authentication with backup codes, corporate SSO and OAuth sign-in, a list of active sessions with sign-out on all devices, a security log.'},
  {q:'What about BIM when the model weighs several gigabytes?',a:'The model is converted into a lightweight browser format. Small files are processed on the client, heavy ones are converted by the server.'}]},

   '<button class="ic" type="button" data-act="sec-up" data-si="'+si+'" title="Выше" aria-label="Выше">↑</button><button class="ic" type="button" data-act="sec-down" data-si="'+si+'" title="Ниже" aria-label="Ниже">↓</button></summary><div class="cb">'+
   fld(base+'.nav','Пункт в меню, пусто = не показывать')+fld(base+'.title','Заголовок раздела')+fld(base+'.lead','Подзаголовок','textarea')+itemsEditor(si)+'</div></details>';
 }).join('');
 h+='<div class="fld"><span>Добавить раздел</span><select id="add-sec"><option value="">Выберите тип</option>'+Object.keys(TYPES).map(function(t){return '<option value="'+t+'">'+esc(TYPE_NAMES[t])+'</option>';}).join('')+'</select></div><div><button class="ic" type="button" data-act="sec-add">+ Добавить раздел</button> <button class="ic x" type="button" data-act="sec-del-last" title="Удалить последний раздел">Удалить последний раздел</button></div>';
 return h;
}
function usedIn(id){
 var u=[];
 Object.keys(state.content).forEach(function(k){var c=state.content[k]; if(c.hero.img===id&&u.indexOf('первый экран')<0)u.push('первый экран');
  c.sections.forEach(function(s){s.items.forEach(function(it){if(it.img===id){var n=s.type==='gallery'?'галерея':(it.title||s.title);if(u.indexOf(n)<0)u.push(n);}});});});
 return u;
}
function tabImages(){
 var total=state.images.reduce(function(a,im){return a+im.src.length;},0);
 return '<label class="drop" id="drop"><input type="file" accept="image/*" multiple id="file-in">Перетащите скриншоты сюда или нажмите, чтобы выбрать<br><span class="hint">PNG или JPEG. Картинки сжимаются до 1600 px по ширине и хранятся внутри страницы.</span></label>'+
  '<div class="hint">Загружено: '+state.images.length+', примерно '+(total/1024/1024).toFixed(1)+' МБ. Ограничение страницы около 16 МБ.</div>'+
  '<div class="imgs">'+state.images.map(function(im,i){var u=usedIn(im.id);return '<div class="img"><img src="'+im.src+'" alt=""><div><div class="fld"><input type="text" data-path="images.'+i+'.name" value="'+esc(im.name)+'" aria-label="Название"></div><div class="m">'+im.w+'×'+im.h+', '+(im.src.length/1024).toFixed(0)+' КБ</div><div class="u">'+(u.length?'Используется: '+esc(u.join(', ')):'Не используется')+'</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="ic" type="button" data-act="img-hero" data-i="'+i+'">На первый экран</button><button class="ic" type="button" data-act="img-gal" data-i="'+i+'">В галерею</button><button class="ic x" type="button" data-act="img-del" data-i="'+i+'">Удалить</button></div></div></div>';}).join('')+'</div>';
}
function tabStyle(){
 return fld('brand','Название')+fld('contact','Email для заявок с формы','text')+fld('defaultLang','Язык по умолчанию для новых посетителей','select','ru:Русский|en:English')+
  '<div class="fld"><span>Цвета</span><div class="colors"><label><input type="color" data-path="colors.signal" value="'+esc(state.colors.signal)+'">Кнопки и акцент</label><label><input type="color" data-path="colors.steel" value="'+esc(state.colors.steel)+'">Структура и ссылки</label></div></div>'+
  '<div class="hint">Тёмная тема подстраивается автоматически: цвета осветляются, чтобы оставаться читаемыми.</div>'+
  '<div><button class="ic" type="button" data-act="reset-colors">Вернуть цвета по умолчанию</button></div>';
}
function renderAdmin(){
 if(A.hidden)return;
 var dirty=JSON.stringify(state)!==pristine;
 A.innerHTML='<div class="ah"><b>Администрирование</b><select id="adm-lang" aria-label="Язык" style="font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)">'+Object.keys(state.content).map(function(l){return '<option value="'+l+'"'+(l===lang?' selected':'')+'>'+esc(LANG_NAMES[l]||l)+'</option>';}).join('')+'</select><button class="ic" type="button" data-act="close-admin" aria-label="Закрыть">Закрыть</button></div>'+
  '<div class="tabs" role="tablist"><button role="tab" aria-selected="'+(tab==='sections')+'" data-tab="sections">Разделы</button><button role="tab" aria-selected="'+(tab==='images')+'" data-tab="images">Скриншоты</button><button role="tab" aria-selected="'+(tab==='style')+'" data-tab="style">Оформление</button></div>'+
  '<div class="abody">'+(tab==='sections'?tabSections():tab==='images'?tabImages():tabStyle())+'</div>'+
  '<div class="af"><div class="st '+statusKind+'">'+esc(statusMsg||(dirty?'Есть несохранённые изменения. Они видны только вам, пока не опубликованы.':'Изменений нет.'))+'</div>'+(function(){var gh=ghTarget(); if(artNs||!artKnown||!gh)return ''; return '<div class="fld"><span>Токен GitHub для публикации в '+esc(gh.owner+'/'+gh.repo)+'</span><input type="password" id="gh-token" autocomplete="off" placeholder="github_pat_…" value="'+esc(ghToken())+'"><span class="hint" style="font-weight:400">Fine‑grained token с правом Contents: Read and write только для этого репозитория. Хранится в этой вкладке до её закрытия и отправляется только на api.github.com.</span></div>';})()+
  '<div class="bt"><button class="btn btn-primary btn-sm" type="button" data-act="save"'+(dirty?'':' disabled')+'>Опубликовать</button><button class="btn btn-ghost btn-sm" type="button" data-act="discard"'+(dirty?'':' disabled')+'>Отменить изменения</button><a class="btn btn-ghost btn-sm" id="dl" href="#" download="reactor-landing.html" hidden>Скачать HTML</a></div></div>';
 bindDrop();
 var ls=document.getElementById('adm-lang'); if(ls)ls.addEventListener('change',function(){setLang(ls.value);});
 var tk=document.getElementById('gh-token'); if(tk)tk.addEventListener('input',function(){try{sessionStorage.setItem('sb-gh-token',tk.value.trim());}catch(e){}});
}
function setStatus(m,k){statusMsg=m||'';statusKind=k||'';var el=A.querySelector('.st');if(el){el.textContent=m;el.className='st '+(k||'');}}
function openAdmin(){A.hidden=false;renderAdmin();}
function closeAdmin(){A.hidden=true;}

/* image intake */
function bindDrop(){
 var d=document.getElementById('drop'),inp=document.getElementById('file-in'); if(!d)return;
 inp.addEventListener('change',function(){addFiles(inp.files);});
 ['dragenter','dragover'].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();d.classList.add('over');});});
 ['dragleave','drop'].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();d.classList.remove('over');});});
 d.addEventListener('drop',function(e){addFiles(e.dataTransfer.files);});
}
function shrink(file){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file), im=new Image();
  im.onload=function(){
   var max=1600,k=Math.min(1,max/im.width),c=document.createElement('canvas');
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   var cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);
   var png=file.type==='image/png'&&file.size<400000?c.toDataURL('image/png'):null;
   var jpg=c.toDataURL('image/jpeg',.84);
   URL.revokeObjectURL(url);
   res({src:(png&&png.length<jpg.length)?png:jpg,w:c.width,h:c.height});
  };
  im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'));};
  im.src=url;
 });
}
function addFiles(files){
 var list=Array.prototype.slice.call(files||[]).filter(function(f){return /^image\//.test(f.type);});
 if(!list.length)return;
 setStatus('Обрабатываю '+list.length+' файл(ов)…');
 Promise.all(list.map(function(f){return shrink(f).then(function(r){state.images.push({id:'im'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,''),src:r.src,w:r.w,h:r.h});}).catch(function(){});})).then(function(){setStatus('');renderAdmin();render();});
}

/* save */
function b64utf8(str){var bytes=new TextEncoder().encode(str),bin='',CH=0x8000;for(var i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin);}
function saveGithub(html,gh,token){
 var api='https://api.github.com/repos/'+gh.owner+'/'+gh.repo+'/contents/'+gh.path;
 var H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
 return fetch(api+'?ref='+encodeURIComponent(gh.branch),{headers:H}).then(function(r){
  if(r.status===401||r.status===403)throw {code:'not_writer'};
  if(r.status===404)return {};
  if(!r.ok)throw {code:'upstream_error',message:'HTTP '+r.status};
  return r.json();
 }).then(function(j){
  var body={message:'Update site from admin panel',content:b64utf8(html),branch:gh.branch}; if(j&&j.sha)body.sha=j.sha;
  return fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
 }).then(function(r){
  if(r.status===401||r.status===403)throw {code:'not_writer'};
  if(r.status===409||r.status===422)throw {code:'conflict'};
  if(!r.ok)throw {code:'upstream_error',message:'HTTP '+r.status};
  return r.json();
 });
}
function failMsg(e){
 var c=e&&e.code;
 if(c==='not_writer'||c==='not_granted'||c==='consent_required')return 'Нет прав на публикацию. Для артефакта нужен доступ на редактирование, для GitHub Pages — токен с правом Contents: Read and write.';
 if(c==='conflict')return 'Кто‑то опубликовал новую версию раньше. Обновите страницу и внесите изменения ещё раз.';
 if(c==='too_large')return 'Страница слишком большая. Удалите часть скриншотов и попробуйте снова.';
 if(c==='rate_limited')return 'Слишком частые публикации. Подождите минуту.';
 return 'Не удалось опубликовать: '+((e&&e.message)||c||'ошибка сети')+'. Попробуйте ещё раз.';
}
function save(){
 var html=buildHtml();
 if(html.length>15.5*1024*1024){setStatus('Страница больше 16 МБ, удалите часть скриншотов.','err');return;}
 setStatus('Публикую…');
 var u=(window.claude&&typeof window.claude.use==='function')?window.claude.use('artifact'):Promise.resolve(null);
 u.then(function(art){
  if(art){
   return art.publish(html).then(function(){pristine=JSON.stringify(state);setStatus('Опубликовано. Страница обновится у всех, кто её открыл.','ok');})
    .catch(function(e){setStatus(failMsg(e),'err');});
  }
  var gh=ghTarget();
  if(gh){
   var token=ghToken();
   if(!token){setStatus('Введите токен GitHub в поле выше, затем нажмите «Опубликовать» ещё раз.','err');return;}
   return saveGithub(html,gh,token).then(function(){pristine=JSON.stringify(state);setStatus('Опубликовано в GitHub. Сайт обновится через одну‑две минуты, обновите страницу позже.','ok');})
    .catch(function(e){setStatus(failMsg(e),'err');});
  }
  var dl=document.getElementById('dl');
  if(dl){dl.hidden=false;dl.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));}
  setStatus('На этом хостинге публикация недоступна. Скачайте HTML с изменениями и загрузите его на сайт.','err');
 });
}

/* events */
A.addEventListener('input',function(e){
 var t=e.target, p=t.getAttribute('data-path'); if(!p)return;
 setPath(p, t.type==='checkbox'?t.checked:t.value);
 if(/\.sections\.\d+\.on$/.test(p)){renderAdmin();}
 statusMsg='';
 var st=A.querySelector('.st'); if(st){st.className='st';st.textContent='Есть несохранённые изменения. Они видны только вам, пока не опубликованы.';}
 A.querySelectorAll('[data-act="save"],[data-act="discard"]').forEach(function(b){b.disabled=false;});
 renderSoon();
});
A.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.key)open[d.dataset.key]=d.open;},true);
function swap(arr,i,j){if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act],[data-tab]'); if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;renderAdmin();return;}
 var act=b.dataset.act, si=+b.dataset.si, ii=+b.dataset.ii, i=+b.dataset.i, s;
 switch(act){
  case 'open-admin': openAdmin(); return;
  case 'close-admin': closeAdmin(); return;
  case 'save': save(); return;
  case 'discard': state=JSON.parse(pristine); render(); renderAdmin(); return;
  case 'lang': setLang(b.dataset.lang); return;
  case 'sec-up': swap(C().sections,si,si-1); break;
  case 'sec-down': swap(C().sections,si,si+1); break;
  case 'sec-add': var sel=document.getElementById('add-sec'), t=sel&&sel.value; if(!t)return; C().sections.push({id:t+'-'+Date.now().toString(36),type:t,on:true,nav:'',title:TYPE_NAMES[t],lead:'',items:[JSON.parse(JSON.stringify(TYPES[t].blank))]}); break;
  case 'sec-del-last': s=C().sections; if(s.length&&confirm('Удалить раздел «'+(s[s.length-1].title||TYPE_NAMES[s[s.length-1].type])+'»?'))s.pop(); break;
  case 'item-up': swap(C().sections[si].items,ii,ii-1); break;
  case 'item-down': swap(C().sections[si].items,ii,ii+1); break;
  case 'item-del': C().sections[si].items.splice(ii,1); break;
  case 'item-add': s=C().sections[si]; s.items.push(JSON.parse(JSON.stringify(TYPES[s.type].blank))); open[L()+'sections.'+si+'.items.'+(s.items.length-1)]=true; break;
  case 'img-hero': (function(id){Object.keys(state.content).forEach(function(k){state.content[k].hero.img=id;});})(state.images[i].id); break;
  case 'img-gal': (function(im){Object.keys(state.content).forEach(function(k){var c=state.content[k]; var g=c.sections.filter(function(x){return x.type==='gallery';})[0]; if(!g){g=JSON.parse(JSON.stringify((k==='en'?EN:RU).sections.filter(function(x){return x.type==='gallery';})[0])); g.items=[]; c.sections.push(g);} g.on=true; g.items.push({img:im.id,caption:im.name});});})(state.images[i]); break;
  case 'img-del': var id=state.images[i].id; if(!confirm('Удалить изображение «'+state.images[i].name+'»?'))return; state.images.splice(i,1); Object.keys(state.content).forEach(function(k){var c=state.content[k]; if(c.hero.img===id)c.hero.img=''; c.sections.forEach(function(x){x.items.forEach(function(it){if(it.img===id)it.img='';});});}); break;
  case 'reset-colors': state.colors={signal:DEFAULT.colors.signal,steel:DEFAULT.colors.steel}; break;
  default: return;
 }
 statusMsg=''; render(); renderAdmin();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!A.hidden)closeAdmin();});

load(); render();
if(location.hash==='#admin')openAdmin();
})();
</script>
